# Render Blueprint: one Postgres database + one Node web service (Express serves the API, Socket.IO and the built SPA).
databases:
  - name: picklelive-db
    plan: basic-256mb          # paid: Render's free Postgres expires. Or remove this block and point DATABASE_URL at Neon.
    region: singapore
    databaseName: picklelive
    user: picklelive

services:
  - type: web
    name: picklelive
    runtime: node
    plan: starter               # free instances sleep when idle (cold starts + dropped sockets); use Starter+ on match days
    region: singapore
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: picklelive-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # APP_ORIGIN is optional: Render's RENDER_EXTERNAL_URL is used automatically. Set it if you add a custom domain.
      - key: APP_ORIGIN
        sync: false
